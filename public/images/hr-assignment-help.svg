<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The HR Assignment Help Journal — 2026–27 guide</title>
  <desc id="desc">Dark green editorial cover with the words People strategy, made practical.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a4036"/>
      <stop offset=".55" stop-color="#0f5c4d"/>
      <stop offset="1" stop-color="#173f36"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".35" r=".65">
      <stop offset="0" stop-color="#d8b67a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#d8b67a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fffdf9" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <text x="600" y="112" fill="#d8b67a" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4.5" text-anchor="middle">THE HR ASSIGNMENT HELP JOURNAL</text>

  <text x="600" y="320" fill="#fffdf9" font-family="Georgia, 'Times New Roman', serif" font-size="74" letter-spacing="-2" text-anchor="middle">People strategy,</text>

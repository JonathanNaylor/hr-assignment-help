  <circle cx="600" cy="320" r="292" fill="none" stroke="#fffdf9" stroke-opacity=".13"/>
  <circle cx="600" cy="320" r="212" fill="none" stroke="#d8b67a" stroke-opacity=".4"/>
  <circle cx="600" cy="320" r="132" fill="#fffdf9" fill-opacity=".055"/>

